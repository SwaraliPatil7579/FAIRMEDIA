<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAIRMEDIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f9fafb;
      color: #111827;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .header-sub { font-size: 10px; opacity: 0.8; margin-top: 2px; }
    .header-logo { font-size: 22px; }

    /* Sections */
    #initial, #loading, #error, #results { padding: 16px; }

    /* Initial state */
    #initial { text-align: center; }
    #initial p { color: #6b7280; margin-bottom: 14px; font-size: 12px; line-height: 1.5; }

    /* Loading */
    #loading { text-align: center; padding: 30px 16px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #6b7280; font-size: 12px; }

    /* Error */
    #error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #dc2626;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Results */
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .score-label { color: #374151; font-weight: 500; }
    .score-value { font-size: 22px; font-weight: 800; }
    .score-low    { color: #16a34a; }
    .score-medium { color: #d97706; }
    .score-high   { color: #dc2626; }

    .risk-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .risk-low    { background: #dcfce7; color: #15803d; }
    .risk-medium { background: #fef9c3; color: #a16207; }
    .risk-high   { background: #fee2e2; color: #b91c1c; }
    .risk-critical { background: #fce7f3; color: #9d174d; }

    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }

    /* Score bars */
    .score-bars { margin-bottom: 12px; }
    .bar-row { margin-bottom: 6px; }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 2px;
    }
    .bar-track {
      height: 5px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: #2563eb;
      transition: width 0.4s ease;
    }

    /* Issues list */
    .issues-header {
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .issue-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 5px;
    }
    .issue-text { font-weight: 600; color: #dc2626; font-size: 12px; }
    .issue-arrow { color: #6b7280; font-size: 11px; margin-top: 2px; }
    .issue-suggestion { color: #16a34a; font-size: 11px; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #e5e7eb; color: #374151; margin-top: 6px; }
    .btn-sm {
      display: inline-block;
      width: auto;
      padding: 5px 12px;
      font-size: 11px;
      margin-top: 8px;
    }

    /* Settings row */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .settings-row label { font-size: 11px; color: #6b7280; white-space: nowrap; }
    .settings-row input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 11px;
    }
    .settings-row input:focus { outline: none; border-color: #2563eb; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="header-title">⚖️ FAIRMEDIA</div>
      <div class="header-sub">AI Bias Detector</div>
    </div>
    <div class="header-logo">🔍</div>
  </div>

  <!-- API URL setting -->
  <div style="padding: 8px 16px; background: #f3f4f6; border-bottom: 1px solid #e5e7eb;">
    <div class="settings-row">
      <label>API:</label>
      <input type="text" id="apiUrlInput" placeholder="http://localhost:8000" />
      <button class="btn btn-sm" id="saveApiBtn" style="background:#2563eb;color:white;border:none;border-radius:5px;cursor:pointer;padding:5px 10px;font-size:11px;">Save</button>
    </div>
  </div>

  <!-- Initial state -->
  <div id="initial">
    <p>Analyze the current page for bias using AI-powered detection across 7 bias categories.</p>
    <button class="btn btn-primary" id="initialAnalyzeBtn">🔍 Analyze This Page</button>
  </div>

  <!-- Loading state -->
  <div id="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Analyzing page for bias…</p>
  </div>

  <!-- Error state -->
  <div id="error" style="display:none;"></div>

  <!-- Results state -->
  <div id="results" style="display:none;">
    <!-- Overall score -->
    <div class="score-row">
      <div>
        <div class="score-label">Overall Bias Score</div>
        <div id="overallScore" class="score-value">—</div>
      </div>
      <div style="text-align:right;">
        <div id="riskBadge" class="risk-badge risk-low">Low</div>
        <div style="font-size:10px;color:#9ca3af;margin-top:4px;" id="modelLabel"></div>
      </div>
    </div>

    <hr class="divider" />

    <!-- Score bars -->
    <div class="score-bars" id="scoreBars"></div>

    <hr class="divider" />

    <!-- Issues -->
    <div id="issuesList"></div>

    <!-- Actions -->
    <button class="btn btn-primary" id="analyzeBtn">🔄 Re-analyze</button>
    <button class="btn btn-secondary" id="viewFullBtn">📊 Open Full Report</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
